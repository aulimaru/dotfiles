# Variables
$default_wallpaper = dolomite-mountains-milky-way-4k-italy_3840x2160.jpg
$wofi_theme = ~/.config/wofi/themes/tokyonight-night.css
$wofi_config = ~/.config/wofi/configs/tokyonight-night
$swaylock_config = ~/.config/swaylock/themes/tokyonight-night

$hy3_config = ~/.config/hypr/themes/tokyonight-night/hy3/tokyonight-night.conf
$dwindle_config = ~/.config/hypr/themes/tokyonight-night/dwindle/tokyonight-night.conf

general {
    gaps_in = 7
    gaps_out = 14
    gaps_workspaces = 0

    border_size = 3

    col.active_border = rgba(3d59a1cc) rgba(9d7cd8cc) 45deg
    col.inactive_border = rgba(a9b1d688)
}

decoration {
    rounding = 0
    inactive_opacity = 0.80
    drop_shadow = false
    blur {
        enabled = false
    }

}

animations {
    enabled = true

    bezier=overshot,0.05,0.9,0.1,1.05
    bezier=exit,0.9,-0.2,0.95,0.05

    animation = windows, 1, 1, overshot, popin 70%
    animation = windowsOut, 0, 2, exit, slide
    animation = borderangle, 1, 7, default
    animation = fade, 1, 3, default
    animation = fadeSwitch, 1, 5, default
    animation = fadeShadow, 1, 5, default
    animation = fadeDim, 1, 5, default
    animation = border, 1, 5, default
    animation = workspaces, 1, 1.5, default, slidefade 3%
}
